[project]
name = "fastapi-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=20.3.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "langchain>=1.3.16",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "mcp>=1.29.0",
    "openinference-instrumentation-langchain>=0.1.70",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
